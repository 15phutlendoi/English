<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Adventure">
<meta name="theme-color" content="#ff9ebb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>English Adventure - Búp</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6f8;
  --ink:#3d2c46;
  --pri:#ff6b9d;
  --pri-dark:#d94678;
  --sec:#9b72f2;
  --sec-dark:#7649d4;
  --mint:#3ec1d3;
  --mint-dark:#2196a6;
  --gold:#ffb830;
  --gold-dark:#df9208;
  --card:#ffffff;
  --line:#f6d5e3;
  --bad:#d64545;
  --ok:#1f9d55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  font:18px/1.4 'Fredoka','Quicksand',-apple-system,system-ui,"Segoe UI",sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 15%, rgba(255,182,209,.35) 0%, transparent 28%),
    radial-gradient(circle at 88% 18%, rgba(205,180,255,.35) 0%, transparent 30%),
    radial-gradient(circle at 50% 88%, rgba(163,247,224,.32) 0%, transparent 34%);
  color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
#app{
  min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
}
.wrap{width:100%;max-width:980px}
h1{font-size:30px;margin:8px 0}
h2{font-size:21px;margin:0 0 10px}
button{
  font:inherit;border:3px solid #fff;border-radius:22px;padding:11px 18px;
  background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line),0 6px 14px rgba(100,50,80,.08);
  min-height:50px;cursor:pointer;transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s;
}
button:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--line)}
button.p{background:linear-gradient(180deg,#ff85b3,#ff5c93);color:#fff;box-shadow:0 5px 0 var(--pri-dark);font-weight:700}
button.sec{background:linear-gradient(180deg,#b392ff,#8e65f0);color:#fff;box-shadow:0 5px 0 var(--sec-dark);font-weight:700}
button.mint{background:linear-gradient(180deg,#62dfed,#31b8c9);color:#fff;box-shadow:0 5px 0 var(--mint-dark);font-weight:700}
button.gold{background:linear-gradient(180deg,#ffd56b,#f9a826);color:#fff;box-shadow:0 5px 0 var(--gold-dark);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}
.big{font-size:68px;line-height:1}
.pcard{
  padding:22px 12px;border-radius:30px;font-weight:700;font-size:24px;
  box-shadow:0 7px 0 var(--line),0 10px 20px rgba(255,107,157,.12);
  display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;
}
.mode{
  padding:24px 16px;border-radius:32px;font-size:25px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  position:relative;color:#fff;border:5px solid #fff;min-height:175px;
}
.mode i{font-style:normal;font-size:62px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.mode small{
  position:absolute;top:12px;right:14px;background:rgba(255,255,255,.28);
  color:#fff;border-radius:12px;padding:3px 10px;font-size:13px;backdrop-filter:blur(4px);
}
.box{background:#fff;border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 4px 0 var(--line);border:2px solid #fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{font-size:30px;padding:4px 10px;min-height:48px}
.sel{outline:4px solid var(--pri)}
input,select,textarea{
  font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;
  width:100%;-webkit-user-select:text;user-select:text;background:#fff;color:var(--ink);
}
.err{color:var(--bad);min-height:22px;margin-top:6px;font-size:15px}
.ok{-webkit-user-select:text;user-select:text;word-break:break-all;font-size:14px}
.lock{
  position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
  opacity:.92;font-size:15px;padding:8px 14px;min-height:42px;z-index:25;background:#fff;
}
.ov{
  position:fixed;inset:0;background:rgba(58,40,74,.6);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;
}
.dlg{background:#fff;border-radius:28px;padding:24px;max-width:400px;width:100%;text-align:center;border:4px solid var(--line)}
.mut{color:#8c7699;font-size:15px}

/* Animations & Kid Effects */
@keyframes bump{30%{transform:scale(1.1) rotate(-3deg)}60%{transform:scale(.95) rotate(2deg)}}
.bump{animation:bump .42s}
@keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.float{animation:floatSlow 3s ease-in-out infinite}
@keyframes pulseHint{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,184,48,.9),0 0 25px 8px rgba(255,184,48,.75);border-color:#ffb830}
  50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(255,184,48,0),0 0 38px 16px rgba(255,107,157,.85);border-color:#ff6b9d}
}
.hint-glow{animation:pulseHint 1.05s ease-in-out infinite !important;z-index:10}
@keyframes wiggleBox{
  0%,100%{transform:rotate(0) scale(1)}
  20%{transform:rotate(-8deg) scale(1.06)}
  40%{transform:rotate(8deg) scale(1.06)}
  60%{transform:rotate(-5deg) scale(1.04)}
  80%{transform:rotate(5deg) scale(1.04)}
}
.wiggle{animation:wiggleBox 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.rainbow-bar{
  background:linear-gradient(90deg,#ff6b9d,#ffb830,#3ec1d3,#9b72f2,#ff6b9d);
  background-size:300% 100%;animation:shimmer 2.5s linear infinite;
}
.stk-common{background:#fff;border:3px solid #f3dce6}
.stk-sparkle{
  background:linear-gradient(125deg,#ffffff 25%,#ffe6f4 45%,#fff8d6 50%,#e3f8ff 55%,#ffffff 75%);
  background-size:220% 100%;animation:shimmer 2.6s linear infinite;border:3px solid #ff9ebb;
  box-shadow:0 4px 14px rgba(255,107,157,.22);
}
.stk-gold{
  background:linear-gradient(135deg,#fff6cc 0%,#ffd86b 50%,#ffb03a 100%);
  border:3px solid #fff;box-shadow:0 0 18px rgba(255,184,48,.75);
}
@keyframes flyToTray{
  0%{transform:scale(1.3) translate(0,0);opacity:1}
  100%{transform:scale(.35) translate(320px,-180px);opacity:.15}
}
.fly-stk{
  position:fixed;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;
  z-index:99;pointer-events:none;animation:flyToTray .5s cubic-bezier(.22,1,.36,1) forwards;
}

/* Word Choice Cards */
.wcard{
  background:#fff;border:5px solid #fff;border-radius:28px;padding:12px;
  box-shadow:0 7px 0 var(--line),0 10px 22px rgba(90,40,70,.1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:transform .16s,opacity .28s;position:relative;overflow:hidden;
}
.wcard:active{transform:scale(.95)}
.wcard.correct-flash{border-color:#2ecc71;box-shadow:0 0 0 6px rgba(46,204,113,.35)}
.wcard.gone{opacity:0;pointer-events:none;transform:scale(.7)}

/* Play Layout with Right Sticker Tray */
.play-shell{display:grid;grid-template-columns:1fr 86px;gap:14px;align-items:stretch;width:100%}
@media(max-width:680px){.play-shell{grid-template-columns:1fr}}
.tray{
  background:rgba(255,255,255,.88);border:4px solid #fff;border-radius:26px;padding:8px 6px;
  box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;
  max-height:460px;overflow-y:auto;
}
.tray.streak-glow{border-color:#ffb830;box-shadow:0 0 22px rgba(255,184,48,.65)}

/* Scene Canvas */
.scene-stage{
  width:100%;height:340px;border-radius:28px;border:6px solid #fff;
  box-shadow:0 8px 0 var(--line),0 12px 28px rgba(80,40,70,.14);
  position:relative;overflow:hidden;touch-action:none;
}
.scene-item{
  position:absolute;width:82px;height:82px;transform:translate(-50%,-50%);
  cursor:grab;touch-action:none;user-select:none;transition:transform .1s;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.18));
}
.scene-item:active{cursor:grabbing;transform:translate(-50%,-50%) scale(1.16)}

/* Confetti */
.confetti{
  position:fixed;top:-20px;width:12px;height:18px;border-radius:4px;z-index:80;pointer-events:none;
  animation:fallConfetti 2.6s linear forwards;
}
@keyframes fallConfetti{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(105vh) rotate(540deg);opacity:0}
}

/* ===== Giai đoạn 5: Chế độ Nhìn – Nói (Miệng hoạt hình & Sóng âm Micro) ===== */
@keyframes talkMouth{
  0%,100%{ry:5px;rx:16px}
  50%{ry:18px;rx:22px}
}
.mouth-talking ellipse.lip-inner{animation:talkMouth .28s ease-in-out infinite}
@keyframes micPulseRing{
  0%{box-shadow:0 0 0 0 rgba(255,107,157,.65),0 8px 20px rgba(255,107,157,.3)}
  70%{box-shadow:0 0 0 22px rgba(255,107,157,0),0 8px 20px rgba(255,107,157,.3)}
  100%{box-shadow:0 0 0 0 rgba(255,107,157,0),0 8px 20px rgba(255,107,157,.3)}
}
.mic-live{animation:micPulseRing 1.2s infinite;background:linear-gradient(180deg,#ff6b9d,#ff3e7f)!important;color:#fff!important}
.wave-wrap{display:flex;align-items:center;justify-content:center;gap:5px;height:36px;margin:8px auto}
.wave-bar{width:8px;height:10px;border-radius:99px;background:linear-gradient(180deg,#ff6b9d,#9b72f2);transition:height .08s ease}
.turn-pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;
  font-size:15px;font-weight:700;background:#fff0f6;color:#d94678;border:2px solid #ffd6e8;
}

/* ===== Giai đoạn 6: Dashboard Thống Kê, Biểu Đồ & Offline Badge ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.stat-card{
  background:#fff;border-radius:20px;padding:14px;border:3px solid var(--line);
  text-align:center;cursor:pointer;transition:transform .14s,border-color .14s;
}
.stat-card:hover{transform:translateY(-2px)}
.stat-card.active{border-color:var(--pri);background:#fff5f9;box-shadow:0 4px 12px rgba(255,107,157,.18)}
.lvl-badge{
  display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;
}
.lvl-0{background:#f1f3f5;color:#6c757d}
.lvl-1{background:#e3fafc;color:#0c8599}
.lvl-2{background:#fff3bf;color:#d97706}
.lvl-3{background:#d3f9d8;color:#2b8a3e}
.bar-chart{
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  height:150px;padding:18px 12px 6px;background:#fff9fb;border-radius:18px;border:2px solid var(--line);
}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar-fill{
  width:100%;max-width:42px;border-radius:10px 10px 4px 4px;
  background:linear-gradient(180deg,#ff6b9d,#9b72f2);transition:height .3s ease;min-height:4px;
}
.net-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;
  font-size:13px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.net-on{background:#d3f9d8;color:#2b8a3e}
.net-off{background:#ffe3e3;color:#c92a2a}
.tbl-wrap{overflow-x:auto;max-height:420px;overflow-y:auto;border-radius:16px;border:2px solid var(--line)}
table.dtbl{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
table.dtbl th,table.dtbl td{padding:10px 12px;text-align:left;border-bottom:1px solid #f6e4ec}
table.dtbl th{background:#fff0f6;position:sticky;top:0;z-index:2;font-weight:700}
.rec-banner{
  background:linear-gradient(135deg,#fff9db,#ffe5ec);border:3px solid #ffb830;
  border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 16px rgba(255,184,48,.2);
}

/* ===== Giao diện "Tờ sticker": hồng pastel & kem sáng, tối ưu iPad ngang/dọc ===== */
:root{--bg:#fffaf5;--ink:#5a2d4d;--pri:#ff9cc2;--pri-dark:#e87aa8;--sec:#cdb8ff;--sec-dark:#a98be8;--mint:#b6ecdc;--mint-dark:#7fcdb6;--gold:#ffd77a;--gold-dark:#eab94a;--line:#ffdbe9;--cut:#f7aecb;
  --stk:0 0 0 2px var(--cut),0 7px 0 rgba(232,122,168,.32),0 12px 18px rgba(232,122,168,.16)}
body{background-color:var(--bg);
  background-image:radial-gradient(circle,#ffdcea 0 3px,transparent 3.6px),radial-gradient(circle at 12% 0%,rgba(255,190,217,.6),transparent 42%),radial-gradient(circle at 100% 100%,rgba(255,229,170,.45),transparent 40%);
  background-size:36px 36px,auto,auto;background-attachment:fixed}
#app{min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.wrap{max-width:1360px}
.wrap.fit{flex:1;display:flex;flex-direction:column;min-height:0}
button{border:5px solid #fff;border-radius:28px;color:var(--ink);min-height:64px;box-shadow:var(--stk)}
button:active{transform:translateY(5px) scale(.97);box-shadow:0 0 0 2px var(--cut),0 1px 0 rgba(232,122,168,.3)}
button.p,button.sec,button.mint,button.gold{color:var(--ink);font-weight:700;box-shadow:var(--stk)}
button.p{background:linear-gradient(180deg,#ffc2da,#ff9cc2)}
button.sec{background:linear-gradient(180deg,#e4d8ff,#c9b3ff)}
button.mint{background:linear-gradient(180deg,#d3f6ea,#a6e4d0)}
button.gold{background:linear-gradient(180deg,#ffeab0,#ffd36e)}
.lock{opacity:.5;min-height:44px;font-size:13px;padding:6px 12px;border-width:3px}
.mode,.pcard{border:6px solid #fff;box-shadow:var(--stk)}
.mode{color:var(--ink);min-height:0;border-radius:38px;font-size:clamp(22px,3.4vmin,36px)}
.mode i{font-size:clamp(64px,13vmin,132px)}
.mode small{background:#fff;color:var(--ink);font-size:clamp(14px,2vmin,20px)}
.pcard{min-height:0;background:#fff}
.box,.dlg,.wcard,.tray{border-color:#fff}
.wcard{box-shadow:var(--stk);border-radius:32px}
.wcard,.wcard *{font-family:'Andika','Fredoka',sans-serif}
.wv{width:var(--wvs,var(--px));height:auto;aspect-ratio:1/1;max-width:100%;container-type:inline-size}
.wd{font-size:clamp(44px,7.5dvh,84px)}

/* Trang chủ: 4 nút lớn lấp đầy màn hình (ngang: 1 hàng 4, dọc: lưới 2x2) */
.wrap.home{padding-bottom:56px}
.modes{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:clamp(12px,2.4vmin,26px);margin-top:14px;min-height:0}
@media(orientation:landscape) and (min-width:900px){.modes{grid-template-columns:repeat(4,1fr)}}
/* Chọn hồ sơ */
.pick{justify-content:center;padding-bottom:56px}
.pick .grid{grid-template-columns:repeat(auto-fit,minmax(200px,270px));justify-content:center;gap:22px}
/* Chọn chủ đề */
.tgrid{grid-template-columns:repeat(auto-fill,minmax(clamp(150px,24vmin,250px),1fr))}
.tgrid .wv{width:min(100%,180px)}
.prog{background:#fff3c4;color:#8a5a00;border-radius:99px;padding:2px 14px;font-size:16px}

/* Màn chơi: vừa một màn hình, không cuộn; khay sticker thành dải ngang */
.wrap.play{max-width:1400px}
.play-shell{display:flex!important;flex-direction:column;flex:1;min-height:0;gap:10px}
.play-shell>div:first-child{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.play-shell>div:first-child>div{width:100%}
.tray{flex-direction:row;max-height:none;height:90px;flex-shrink:0;overflow-x:auto;overflow-y:hidden;padding:6px 16px;gap:12px;justify-content:flex-start;box-shadow:var(--stk);border-radius:30px}
#trayList{flex-direction:row!important}
.learn-card{width:min(92vw,calc(40dvh + 90px));--wvs:min(70vw,40dvh)}
.speak-card{width:min(92vw,600px);--wvs:min(60vw,30dvh)}
.opts{--wvs:min(100%,calc((100dvh - 380px)/var(--rows)))}
/* Nút thoát: giữ 1 giây, nước hồng dâng lên cho bé thấy */
.hold{position:relative;isolation:isolate;overflow:hidden;width:72px;height:72px;padding:0;border-radius:50%;font-size:30px;flex-shrink:0}
.hold::before{content:"";position:absolute;inset:0;z-index:-1;background:#ff9cc2;transform:scaleY(0);transform-origin:bottom}
.hold.holding::before{transform:scaleY(1);transition:transform 1s linear}
.hold.nudge{animation:bump .4s}
.scene-stage{height:clamp(300px,44dvh,640px)}
@media(prefers-reduced-motion:reduce){.float,.wiggle,.rainbow-bar{animation:none}}
</style>

/* ============================================================================
   5. BỘ TỔNG HỢP ÂM THANH (WEB AUDIO API) & GIỌNG ĐỌC TTS CHO BÉ
   ============================================================================ */
let audioCtx=null;
function initAudio(){
  if(!audioCtx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(C)audioCtx=new C();
  }
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function playTing(){
  try{
    initAudio();if(!audioCtx)return;
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1318.5,t+.16);
    g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.33);
  }catch(e){}
}
function playGentleBoing(){
  try{
    initAudio();if(!audioCtx)return;
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(390,t+.15);
    g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.24);
  }catch(e){}
}
function playGoldFanfare(){
  try{
    initAudio();if(!audioCtx)return;
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
      const t=audioCtx.currentTime+i*.09,o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='triangle';o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.36);
      o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.38);
    });
  }catch(e){}
}

function speak(t,rate=.85,onEnd=null){
  initAudio();
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;u.pitch=1.08;
    const sc=v=>(v.lang==='en-US'?2:0)+(/Samantha|Ava|Allison|Zoe|Nicky|Siri|Enhanced|Premium/i.test(v.name)?3:0);
    const BAD=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy/i;
    const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!BAD.test(v.name)).sort((a,b)=>sc(b)-sc(a))[0];
    if(v)u.voice=v;
    let done=false;
    const fin=()=>{if(!done){done=true;if(onEnd)onEnd()}};
    u.onend=fin;u.onerror=fin;
    speechSynthesis.speak(u);
    setTimeout(fin,Math.max(1600,t.length*130));
  }catch(e){if(onEnd)setTimeout(onEnd,500)}
}

   - Lưu song song xuống máy iPad để bé chơi mượt cả khi mất mạng Wi-Fi
   - Tự động đồng bộ lại lên Firebase ngay khi có mạng trở lại

const LS_KEY='bup_english_adventure_v1_cache';
function readLocalCache(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    return raw?JSON.parse(raw):{};
  }catch(e){return {};}
}
function writeLocalCache(patch){
  try{
    const cur=readLocalCache();
    const next={...cur,...patch,updatedAt:Date.now()};
    localStorage.setItem(LS_KEY,JSON.stringify(next));
  }catch(e){}
}
async function syncPendingToCloud(){
  if(!S.user||!navigator.onLine)return;
  const cache=readLocalCache();
  if(!cache.pendingProfiles)return;
  try{
    await set(ref(db,'users/'+S.user.uid+'/profiles'),clean(S.profiles));
    writeLocalCache({pendingProfiles:false,profiles:S.profiles});
    S.pendingSync=false;
    if(S.view==='admin')render();
  }catch(e){}
}
window.addEventListener('online',()=>{
  S.online=true;
  syncPendingToCloud();
  if(S.view==='admin')render();
});
window.addEventListener('offline',()=>{
  S.online=false;
  if(S.view==='admin')render();
});

   10. GIAI ĐOẠN 3: THUẬT TOÁN CHỌN TỪ, ĐỒNG HỒ CHÚ CHÓ CHẠY & 3 CHẾ ĐỘ HỌC
   ============================================================================ */
function buildSessionQueue(topicId,count){
  let pool=(S.words||[]).filter(w=>w.active!==false&&(topicId==='surprise'||w.topic_id===topicId));
  if(!pool.length)pool=(S.words||[]).filter(w=>w.active!==false);
  if(!pool.length)pool=buildDefaultWords();

  const now=Date.now(),newW=[],dueW=[],famW=[];
  pool.forEach(w=>{
    const st=getWStat(w.id);
    if(!st.level)newW.push(w);
    else if((st.nextReview||0)<=now)dueW.push(w);
    else famW.push(w);
  });
  const shuf=a=>[...a].sort(()=>Math.random()-.5);
  // 1-2 từ mới + từ đến hạn ôn + từ đã thuộc để bé tự tin
  const ordered=[...shuf(newW).slice(0,2),...shuf(dueW),...shuf(famW),...shuf(newW).slice(2)];
  const out=[];
  for(let i=0;i<count;i++)out.push(ordered[i%ordered.length]);
  return out;
}

function stopTimer(){
  if(S.timer){clearInterval(S.timer);S.timer=null;}
  stopSpeakResources();
}

function startTimer(){
  stopTimer();
  const s=S.sess;if(!s||!s.totalSec)return;
  S.timer=setInterval(()=>{
    if(!S.sess||S.view!=='play'){stopTimer();return;}
    s.remSec-=.25;
    const pct=Math.max(0,Math.min(100,((s.totalSec-s.remSec)/s.totalSec)*100));
    const bar=document.getElementById('pBarFill'),pup=document.getElementById('pBarPup');
    if(bar)bar.style.width=pct+'%';
    if(pup)pup.style.left=`calc(${pct}% - 18px)`;
    if(s.remSec<=0){
      stopTimer();
      s.timeUp=true;
      finishSession(true);
    }
  },250);
}

function startSession(mode,topicId,customWordIds=null){
  stopTimer();
  const p=curProf(),st=(p&&p.settings)||{};
  let count=6,totalSec=0,presetKey='easy';

  if(mode==='listen'){
    presetKey=st.listenPreset||'easy';
    if(presetKey==='custom'){count=+st.listenCustomWords||10;totalSec=+st.listenCustomSec||180;}
    else{count=PRESETS.listen[presetKey].words;totalSec=PRESETS.listen[presetKey].sec;}
  }else if(mode==='speak'){
    presetKey=st.speakPreset||'easy';
    if(presetKey==='custom'){count=+st.speakCustomWords||5;totalSec=+st.speakCustomSec||180;}
    else{count=PRESETS.speak[presetKey].words;totalSec=PRESETS.speak[presetKey].sec;}
  }else{
    count=6;totalSec=0; // Học từ mới: 6 từ, cứ sau 3 từ hỏi nhẹ 1 câu
  }

  let queue=[];
  if(Array.isArray(customWordIds)&&customWordIds.length){
    const allW=(S.words&&S.words.length?S.words:buildDefaultWords());
    const matched=customWordIds.map(id=>allW.find(w=>w.id===id)).filter(Boolean);
    count=matched.length||count;
    for(let i=0;i<count;i++)queue.push(matched[i%matched.length]);
  }else{
    queue=buildSessionQueue(topicId,count);
  }
  S.sess={
    mode,topicId,presetKey,queue,idx:0,
    totalSec,remSec:totalSec,timeUp:false,
    // Bậc thang số ảnh 2 -> 4 -> 8
    choices:2,consecAtTier:0,streak:0,wrongOnCur:0,hintGlow:false,
    opts:[],locked:false,
    // Học từ mới
    miniCheck:false,miniOpts:[],imgSlide:0,
    // Nhìn - Nói (Giai đoạn 5)
    speakTurn:1,listening:false,mouthTalking:false,playingChildVoice:false,
    liveTranscript:'',vocalMs:0,speakModeUsed:'sr',
    // Phần thưởng Sticker trong khay
    tray:[],answered:0,firstTryCnt:0,
    boxOpened:false,rareWon:null
  };
  S.view='play';
  if(mode==='listen'){prepListenQ();startTimer();}
  else if(mode==='speak'){prepSpeakQ();startTimer();}
  else prepLearnCard();
}

/* ----- Cơ chế rút Sticker & Bay vào khay (Mục 4.2 & 4.3) ----- */
function drawSticker(rareOnly=false,wordObj=null){
  const pool=allStickers();
  // Nếu bé vừa thuộc một từ động vật có sticker tương ứng, ưu tiên tặng sticker con vật đó
  if(wordObj){
    const animalStk=pool.find(s=>s.wordId===wordObj.id);
    if(animalStk&&Math.random()<.55)return animalStk;
  }
  const p=curProf(),preset=(S.sess&&S.sess.presetKey)||'easy';
  const r=Math.random()*100;
  let tier='common';
  if(rareOnly){
    const goldChance=preset==='hard'?45:preset==='medium'?30:20;
    tier=r<goldChance?'gold':'sparkle';
  }else{
    if(r<5)tier='gold';
    else if(r<30)tier='sparkle';
    else tier='common';
  }
  const cands=pool.filter(s=>s.rarity===tier);
  return cands[Math.floor(Math.random()*cands.length)]||pool[0];
}

function awardStickerToTray(wordObj=null){
  const s=S.sess,p=curProf();if(!s||!p)return;
  const stk=drawSticker(false,wordObj);

}

}

/* ----- Chế độ 2: Nghe - Chạm bậc thang 2 -> 4 -> 8 (Mục 3.4) ----- */
function prepListenQ(){
  const s=S.sess;
  if(s.idx>=s.queue.length){finishSession(false);return;}
  const target=s.queue[s.idx];
  s.wrongOnCur=0;s.hintGlow=false;s.locked=false;
  const n=s.choices;
  const allW=(S.words&&S.words.length?S.words:buildDefaultWords()).filter(w=>w.active!==false&&w.id!==target.id);
  let pool=[];
  if(n<=2){
    // Bậc thấp lấy khác topic để bé dễ phân biệt
    pool=allW.filter(w=>w.topic_id!==target.topic_id);
    if(pool.length<2)pool=allW;
  }else{
    // Bậc cao ưu tiên cùng topic
    const same=allW.filter(w=>w.topic_id===target.topic_id).sort(()=>Math.random()-.5);
    const diff=allW.filter(w=>w.topic_id!==target.topic_id).sort(()=>Math.random()-.5);
    pool=[...same,...diff];
  }
  const dist=pool.sort(()=>Math.random()-.5).slice(0,n-1);
  s.opts=[target,...dist].sort(()=>Math.random()-.5).map(w=>({w,gone:false}));
  render();
  speak(`Touch the ${target.word}!`,.88);
}

function onTapListenOpt(wId){
  const s=S.sess;if(!s||s.locked)return;
  const target=s.queue[s.idx],st=getWStat(target.id);
  const p=curProf(),maxC=(p&&p.settings&&+p.settings.maxChoices)||8;

  if(wId===target.id){
    s.locked=true;
    playTing();
    st.seen++;
    st.maxChoices=Math.max(st.maxChoices||2,s.choices);
    s.answered++;

    if(s.wrongOnCur===0){
      // Đúng ngay lần đầu
      st.firstTry++;s.firstTryCnt++;s.streak++;
      if(s.choices>=4&&st.level<3)st.level++;
      else if(!st.level)st.level=1;
      const days=st.level===1?.5:st.level===2?2:7;
      st.nextReview=Date.now()+days*86400000;

      // Tăng bậc thang: Bậc 2 đúng 1 lần -> 4; Bậc 4 đúng 2 lần liên tiếp -> 8
      if(s.choices===2&&maxC>=4){s.choices=4;s.consecAtTier=0;}
      else if(s.choices===4&&maxC>=8){
        s.consecAtTier++;
        if(s.consecAtTier>=2){s.choices=8;s.consecAtTier=0;}
      }
    }else{
      st.assisted++;s.streak=0;
      if(st.level>1&&!s.hintGlow)st.level--;
    }

    awardStickerToTray(target);
    const cardEl=document.getElementById('wopt_'+wId);
    if(cardEl)cardEl.classList.add('correct-flash');
    setTimeout(()=>{s.idx++;prepListenQ();},440);
  }else{
    // Bé chạm sai -> Gỡ rối: ẩn ảnh vừa chọn + một nửa số ảnh sai còn lại
    playGentleBoing();
    s.wrongOnCur++;s.consecAtTier=0;s.streak=0;
    const tapped=s.opts.find(o=>o.w.id===wId);
    if(tapped)tapped.gone=true;

    const remWrong=s.opts.filter(o=>!o.gone&&o.w.id!==target.id);
    const dropCnt=Math.floor(remWrong.length/2);
    for(let i=0;i<dropCnt;i++)remWrong[i].gone=true;

    const remAll=s.opts.filter(o=>!o.gone);
    if(remAll.length<=1||s.wrongOnCur>=2)s.hintGlow=true;

    // Câu kế tiếp bắt đầu thấp hơn 1 bậc
    if(s.choices===8)s.choices=4;
    else if(s.choices===4)s.choices=2;

    render();
    speak(target.word,.8);
  }
}

   10.5. GIAI ĐOẠN 5: CHẾ ĐỘ NHÌN – NÓI (3 LƯỢT, ĐỌC CHẬM TÁCH ÂM, CHẤM DỄ TÍNH
         & DỰ PHÒNG GHI ÂM PHÁT LẠI TRÊN IPAD - MỤC 3.5)
   ============================================================================ */
let activeSR=null,activeStream=null,activeRecorder=null,activeMicTimer=null,activeRaf=null;

function stopSpeakResources(){
  if(activeMicTimer){clearTimeout(activeMicTimer);activeMicTimer=null;}
  if(activeRaf){cancelAnimationFrame(activeRaf);activeRaf=null;}
  if(activeSR){try{activeSR.onend=null;activeSR.onerror=null;activeSR.onresult=null;activeSR.stop();}catch(e){}activeSR=null;}
  if(activeRecorder&&activeRecorder.state!=='inactive'){try{activeRecorder.stop();}catch(e){}activeRecorder=null;}
  if(activeStream){try{activeStream.getTracks().forEach(t=>t.stop());}catch(e){}activeStream=null;}
}

// Khoảng cách chỉnh sửa Levenshtein để chấm tương đối (Mục 3.5)
function editDist(a,b){
  a=String(a||'').toLowerCase().trim();b=String(b||'').toLowerCase().trim();
  const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

// Tạo câu giới thiệu tự nhiên: "Look! A cat. Say cat!" hoặc "Look! Red. Say red!"
function buildIntroPrompt(w){
  const word=w.word.toLowerCase();
  const noArticleTopics=['colors','body','food','clothes','nature'];
  const isPluralOrUncount=word.endsWith('s')||noArticleTopics.includes(w.topic_id)||word.includes(' ');
  if(isPluralOrUncount)return `Look! ${w.word}. Say ${w.word}!`;
  const art=/^[aeiou]/i.test(word)?'an':'a';
  return `Look! ${art} ${w.word}. Say ${w.word}!`;
}

// Tự động tách âm đọc chậm nếu từ chưa khai báo tts_slow (ví dụ: "c... a... t... cat")
function buildSlowBreakdown(w){
  if(w.tts_slow&&w.tts_slow.trim())return `${w.tts_slow.trim()}... ${w.word}`;
  const cleanW=w.word.trim();
  if(cleanW.length<=4)return `${cleanW.split('').join('... ')}... ${cleanW}`;
  const mid=Math.ceil(cleanW.length/2);
  return `${cleanW.slice(0,mid)}... ${cleanW.slice(mid)}... ${cleanW}`;
}

// Tiêu chí chấm phát âm "rất dễ tính" chỉnh được trong Admin (very_easy / easy / medium)
function evaluateSpeech(transcript,targetWordObj,turn,vocalMs){
  const p=curProf(),st=(p&&p.settings)||{};
  const lenience=st.speechLenience||'very_easy'; // very_easy | easy | medium
  const raw=String(transcript||'').toLowerCase().trim();
  const target=targetWordObj.word.toLowerCase().trim();
  const vars=arr(targetWordObj.variants).map(v=>v.toLowerCase().trim()).filter(Boolean);

  // 1. Ở lượt 2 và 3: bất kỳ tiếng nói nào dài hơn ~0.5 giây (500ms) đều được tính là "đã cố gắng" (Pass)
  if(turn>=2&&vocalMs>=480&&(lenience==='very_easy'||lenience==='easy'))return true;

  if(!raw)return false;
  // 2. Chứa từ đích hoặc trùng biến thể phát âm lệch thường gặp
  if(raw.includes(target)||vars.some(v=>raw.includes(v)))return true;

  const tokens=raw.split(/\s+/).filter(Boolean);
  for(const tk of tokens){
    // Cùng âm đầu cho mức Rất dễ / Dễ
    if(lenience==='very_easy'&&tk[0]===target[0]&&tk.length>=2)return true;
    if(lenience==='easy'&&tk.slice(0,2)===target.slice(0,2)&&tk.length>=2)return true;
    // Khoảng cách chỉnh sửa nhỏ
    const dist=editDist(tk,target);
    if(lenience==='very_easy'&&dist<=2)return true;
    if(lenience==='easy'&&dist<=1)return true;
    if(lenience==='medium'&&dist===0)return true;
    for(const v of vars){
      if(editDist(tk,v)<=1)return true;
    }
  }
  // Lượt 2 & 3 có phát sinh bất kỳ âm tiết nào được nhận diện
  if(turn>=2&&raw.length>=2&&lenience!=='medium')return true;
  return false;
}

// Hình miệng hoạt hình SVG mở/đóng theo nhịp đọc chậm (Mục 3.5)

    <path d="M14 35 Q36 14 60 22 Q84 14 106 35 Q84 60 60 58 Q36 60 14 35 Z" fill="#ff5c8a" stroke="#fff" stroke-width="3"/>
    <ellipse class="lip-inner" cx="60" cy="36" rx="18" ry="${talking?15:6}" fill="#6a1b3a"/>
    <path d="M44 27 Q60 31 76 27" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="60" cy="44" rx="11" ry="5" fill="#ff8fab" opacity=".85"/>

}

function updateWaveBars(level){
  for(let i=0;i<7;i++){
    const b=document.getElementById('wbar_'+i);
    if(b){
      const factor=[.45,.75,1,.85,1,.75,.45][i];
      const h=Math.max(8,Math.min(36,Math.round(8+level*28*factor)));
      b.style.height=h+'px';
    }
  }
}

function prepSpeakQ(){
  stopSpeakResources();
  const s=S.sess;
  if(s.idx>=s.queue.length){finishSession(false);return;}
  s.speakTurn=1;s.listening=false;s.mouthTalking=false;s.playingChildVoice=false;
  s.liveTranscript='';s.vocalMs=0;s.locked=false;
  const target=s.queue[s.idx];
  render();
  speak(buildIntroPrompt(target),.86,()=>{
    if(S.view==='play'&&S.sess===s&&!s.locked)listenMic();
  });
}

async function listenMic(){
  stopSpeakResources();
  const s=S.sess;if(!s||S.view!=='play'||s.locked)return;
  const target=s.queue[s.idx],p=curProf(),st=(p&&p.settings)||{};
  const micMode=st.micMode||'auto'; // auto | record | off
  s.listening=true;s.mouthTalking=false;s.playingChildVoice=false;
  s.liveTranscript='';s.vocalMs=0;
  render();

  if(micMode==='off'){
    activeMicTimer=setTimeout(()=>{if(S.view==='play'&&S.sess===s&&s.listening)passSpeak(true,'touch');},2600);
    return;
  }

  // Khởi tạo đo mức âm lượng giọng bé (Voice Activity Detection ~0.5s) và ghi âm dự phòng
  let recordedChunks=[];
  try{
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      activeStream=await navigator.mediaDevices.getUserMedia({audio:true});
      initAudio();
      if(audioCtx){
        const src=audioCtx.createMediaStreamSource(activeStream);
        const analyser=audioCtx.createAnalyser();
        analyser.fftSize=256;
        src.connect(analyser);
        const buf=new Uint8Array(analyser.frequencyBinCount);
        let lastTick=performance.now();
        const tick=()=>{
          if(!s.listening||S.view!=='play')return;
          const now=performance.now(),dt=now-lastTick;lastTick=now;
          analyser.getByteFrequencyData(buf);
          let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i];
          const avg=sum/buf.length;
          const norm=Math.min(1,avg/65);
          updateWaveBars(norm);
          if(avg>18){
            s.vocalMs+=dt;
            // Nếu ở lượt 2 hoặc 3 bé đã phát âm rõ > 650ms ở chế độ record hoặc rất dễ
            if(s.speakTurn>=2&&s.vocalMs>=650&&micMode==='record'&&!s.locked){
              finishRecordAndPass(recordedChunks);return;
            }
          }
          activeRaf=requestAnimationFrame(tick);
        };
        activeRaf=requestAnimationFrame(tick);
      }
      if(window.MediaRecorder){
        activeRecorder=new MediaRecorder(activeStream);
        activeRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)recordedChunks.push(e.data);};
        activeRecorder.start();
      }
    }
  }catch(e){}

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const useSR=SR&&micMode==='auto'&&navigator.onLine!==false;

  if(useSR){
    s.speakModeUsed='sr';
    try{
      const rec=new SR();
      activeSR=rec;
      rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=5;
      let done=false;
      activeMicTimer=setTimeout(()=>{
        if(!done){
          done=true;
          // Kiểm tra xem bé đã cố gắng nói >0.5s ở lượt 2-3 chưa
          if(evaluateSpeech(s.liveTranscript,target,s.speakTurn,s.vocalMs)){
            stopSpeakResources();passSpeak(true,'effort');
          }else{
            stopSpeakResources();onSpeakFailTurn();
          }
        }
      },4000);

      rec.onresult=ev=>{
        let txt='';
        for(let i=0;i<ev.results.length;i++){
          for(let j=0;j<ev.results[i].length;j++)txt+=' '+ev.results[i][j].transcript.toLowerCase();
        }
        s.liveTranscript=txt.trim();
        const trEl=document.getElementById('liveTrText');
        if(trEl&&s.liveTranscript)trEl.textContent=`"${s.liveTranscript.split(' ').slice(-2).join(' ')}"`;

        if(!done&&evaluateSpeech(s.liveTranscript,target,s.speakTurn,s.vocalMs)){
          done=true;stopSpeakResources();passSpeak(true,'sr');
        }
      };
      rec.onerror=()=>{
        if(!done){
          done=true;
          if(s.vocalMs>=420){finishRecordAndPass(recordedChunks);}
          else{stopSpeakResources();onSpeakFailTurn();}
        }
      };
      rec.onend=()=>{
        if(!done){
          done=true;
          if(evaluateSpeech(s.liveTranscript,target,s.speakTurn,s.vocalMs)){
            stopSpeakResources();passSpeak(true,'sr');
          }else if(s.vocalMs>=450&&s.speakTurn>=2){
            finishRecordAndPass(recordedChunks);
          }else{
            stopSpeakResources();onSpeakFailTurn();
          }
        }
      };
      rec.start();
      return;
    }catch(e){}
  }

  // Phương án dự phòng (Mục 3.5 & Mục 9): Ghi âm giọng bé 3.6 giây -> Phát lại sau giọng mẫu -> Pass
  s.speakModeUsed='record';
  activeMicTimer=setTimeout(()=>{
    if(s.vocalMs>=350||s.speakTurn===3){
      finishRecordAndPass(recordedChunks);
    }else{
      stopSpeakResources();onSpeakFailTurn();
    }
  },3600);
}

function finishRecordAndPass(chunks){
  const s=S.sess;if(!s||S.view!=='play'||s.locked)return;
  s.locked=true;s.listening=false;
  const target=s.queue[s.idx];
  const finalize=()=>{
    stopSpeakResources();
    s.locked=false;
    passSpeak(s.speakTurn<=2,'record');
  };
  if(activeRecorder&&activeRecorder.state!=='inactive'){
    activeRecorder.onstop=()=>{
      stopSpeakResources();
      if(chunks.length>0){
        s.playingChildVoice=true;render();
        const blob=new Blob(chunks,{type:'audio/mp4'});
        const url=URL.createObjectURL(blob);
        const au=new Audio(url);
        au.onended=()=>{URL.revokeObjectURL(url);s.playingChildVoice=false;s.locked=false;passSpeak(s.speakTurn<=2,'record');};
        au.onerror=()=>{s.playingChildVoice=false;s.locked=false;passSpeak(s.speakTurn<=2,'record');};
        au.play().catch(()=>finalize());
      }else finalize();
    };
    try{activeRecorder.stop();}catch(e){finalize();}
  }else finalize();
}

function onSpeakFailTurn(){
  stopSpeakResources();
  const s=S.sess;if(!s||S.view!=='play'||s.locked)return;
  const target=s.queue[s.idx];
  const p=curProf(),slowRate=(p&&p.settings&&+p.settings.slowRate)||0.6;
  const slowText=buildSlowBreakdown(target);
  s.listening=false;

  if(s.speakTurn===1){
    // Lượt 2: hiện miệng hoạt hình đọc chậm và tách âm ("c... a... t... cat"), rồi mời "Your turn!"
    s.speakTurn=2;s.mouthTalking=true;render();
    speak(`${slowText}. Your turn!`,slowRate,()=>{
      if(S.view==='play'&&S.sess===s){s.mouthTalking=false;listenMic();}
    });
  }else if(s.speakTurn===2){
    // Lượt 3: đọc chậm tách âm lần nữa kèm miệng hoạt hình, mở micro lần 3
    s.speakTurn=3;s.mouthTalking=true;render();
    speak(`${slowText}. Say ${target.word}!`,slowRate,()=>{
      if(S.view==='play'&&S.sess===s){s.mouthTalking=false;listenMic();}
    });
  }else{
    // Lần 3 luôn pass với lời khen "Good try! You're so brave!"
    passSpeak(false,'turn3_brave');
  }
}

function passSpeak(firstOrSecond,reason='sr'){
  stopSpeakResources();
  const s=S.sess;if(!s||S.view!=='play'||s.locked)return;
  s.locked=true;s.listening=false;s.mouthTalking=false;
  const target=s.queue[s.idx],st=getWStat(target.id);
  st.seen++;
  st.speakTries=(st.speakTries||0)+s.speakTurn;
  s.answered++;
  playTing();
  awardStickerToTray(target);

  if(firstOrSecond){
    st.speakPass=(st.speakPass||0)+1;
    st.needsPractice=false;
    s.firstTryCnt++;s.streak++;
    if(st.level<3)st.level++;
    const days=st.level===1?.5:st.level===2?2:7;
    st.nextReview=Date.now()+days*86400000;
    render();
    speak(`Yay! ${target.word}!`,.94,()=>{s.idx++;prepSpeakQ();});
  }else{
    // Đánh dấu "cần luyện thêm" trong thống kê của phụ huynh nhưng bé luôn được khen ngợi
    st.needsPractice=true;
    if(!st.level)st.level=1;
    render();
    speak(`Good try! You're so brave!`,.92,()=>{s.idx++;prepSpeakQ();});
  }
}

function bindSceneDrag(){
  const stage=document.getElementById('sceneStage');if(!stage)return;
  let dragEl=null,dragIdx=-1,moved=false;

  const onDown=e=>{
    const item=e.target.closest('.scene-item');if(!item)return;
    e.preventDefault();
    dragEl=item;dragIdx=+item.dataset.idx;moved=false;
    item.classList.remove('bump');void item.offsetWidth;item.classList.add('bump');
    playTing();speak(item.dataset.name||'Sticker',.92);
  };
  const onMove=e=>{
    if(!dragEl)return;
    moved=true;
    const pt=e.touches?e.touches[0]:e;
    const r=stage.getBoundingClientRect();
    const x=Math.max(8,Math.min(92,((pt.clientX-r.left)/r.width)*100));
    const y=Math.max(12,Math.min(88,((pt.clientY-r.top)/r.height)*100));
    dragEl.style.left=x+'%';dragEl.style.top=y+'%';
    const p=curProf();
    if(p&&p.scenes&&p.scenes[S.sceneBg]&&p.scenes[S.sceneBg][dragIdx]){
      p.scenes[S.sceneBg][dragIdx].x=Math.round(x);
      p.scenes[S.sceneBg][dragIdx].y=Math.round(y);
    }
  };
  const onUp=()=>{
    if(!dragEl)return;
    dragEl=null;
    const p=curProf();
    if(moved&&p&&S.user&&S.cur){
      update(ref(db,'users/'+S.user.uid+'/profiles/'+S.cur+'/scenes'),clean(p.scenes||{})).catch(()=>{});
    }
  };
  stage.addEventListener('mousedown',onDown);
  stage.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp,{once:false});
  stage.addEventListener('touchstart',onDown,{passive:false});
  stage.addEventListener('touchmove',onMove,{passive:false});
  stage.addEventListener('touchend',onUp);
}

/* ----- Kiểm tra gợi ý nâng mức chơi sau 3 lượt hoàn thành xuất sắc liên tiếp (Mục 3.7 & 5.3) ----- */
function checkLevelUpRecommendation(pid,p){
  if(!p)return [];
  const st=p.settings||{listenPreset:'easy',speakPreset:'easy'};
  const sessions=arr(p.sessions);
  const recs=[];
  const nextMap={easy:{key:'medium',label:'Trung bình'},medium:{key:'hard',label:'Khó'}};

  [['listen','Nghe – Chạm','listenPreset'],['speak','Nhìn – Nói','speakPreset']].forEach(([mKey,mLabel,settingKey])=>{
    const curPreset=st[settingKey]||'easy';
    const nextInfo=nextMap[curPreset];
    if(!nextInfo)return;
    const dismissKey=`${pid}_${mKey}_${curPreset}`;
    if(S.dismissedRecs[dismissKey])return;

    const modeSessions=sessions.filter(s=>s.mode===mKey&&(s.preset||'easy')===curPreset).slice(0,3);
    if(modeSessions.length>=3){
      const allGreat=modeSessions.every(s=>{
        const planned=s.planned||1;
        const firstRatio=(s.firstTry||0)/planned;
        return !s.timeUp && (s.answered||0)>=planned && firstRatio>=0.7;
      });
      if(allGreat){
        recs.push({pid,mode:mKey,modeLabel:mLabel,settingKey,curPreset,nextKey:nextInfo.key,nextLabel:nextInfo.label,dismissKey});
      }
    }
  });
  return recs;
}

/* ----- Tab 1: Dashboard Tiến Độ Chi Tiết Cho Phụ Huynh (Mục 5.3) ----- */
function tDash(){
  const ps=Object.entries(S.profiles);
  if(!ps.length){
    return `<div class="box" style="text-align:center;padding:28px">
      <div class="big">👧</div>
      <h2>Chưa có hồ sơ của bé</h2>
      <p class="mut">Hãy tạo hồ sơ cho bé Búp để bắt đầu theo dõi tiến độ học từ vựng nhé!</p>
      <button class="p" data-act="seedbup">✨ Tạo nhanh hồ sơ mặc định cho bé Búp</button>
    </div>`;
  }
  if(!S.dashChild||!S.profiles[S.dashChild])S.dashChild=S.cur||ps[0][0];
  const pid=S.dashChild,p=S.profiles[pid];
  const allWords=(S.words&&S.words.length?S.words:buildDefaultWords()).filter(w=>w.active!==false);
  const allTopics=(S.topics&&S.topics.length?S.topics:DEFAULT_TOPICS).filter(t=>t.active!==false).sort((a,b)=>(a.order||99)-(b.order||99));
  const wStatsMap=p.wordStats||{};
  const sessions=arr(p.sessions);
  const now=Date.now();

  // 1. Đếm số từ theo 4 mức (0: Mới, 1: Quen, 2: Nhớ, 3: Thuộc)
  const lvCounts=[0,0,0,0];
  allWords.forEach(w=>{
    const st=wStatsMap[w.id];
    const lv=st&&st.level?Math.min(3,Math.max(0,st.level)):0;
    lvCounts[lv]++;
  });
  const totalW=allWords.length||1;

  // 2. Danh sách "Từ bé hay nhầm" (Nghe - Chạm) & "Từ cần luyện phát âm" (Nhìn - Nói)
  const confusedWords=allWords.filter(w=>{
    const st=wStatsMap[w.id];
    return st && (st.assisted>0 || (st.seen>=2 && (st.firstTry||0)/st.seen<0.5));
  }).sort((a,b)=>(wStatsMap[b.id].assisted||0)-(wStatsMap[a.id].assisted||0));

  const speakPracticeWords=allWords.filter(w=>{
    const st=wStatsMap[w.id];
    return st && (st.needsPractice || (st.speakTries||0)>(st.speakPass||0));
  });

  // 3. Thống kê thời gian học 7 ngày gần nhất & hôm nay
  const days7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(now-i*86400000);
    const key=d.toISOString().slice(0,10);
    const lb=`${d.getDate()}/${d.getMonth()+1}`;
    days7.push({key,lb,sec:0,cnt:0});
  }
  let weekSec=0,todaySec=0;
  const todayKey=new Date(now).toISOString().slice(0,10);
  sessions.forEach(s=>{
    if(!s.date)return;
    const k=new Date(s.date).toISOString().slice(0,10);
    const dur=s.durationSec||45;
    if(k===todayKey)todaySec+=dur;
    const slot=days7.find(d=>d.key===k);
    if(slot){slot.sec+=dur;slot.cnt++;weekSec+=dur;}
  });
  const maxDayMin=Math.max(5,...days7.map(d=>Math.ceil(d.sec/60)));

  // 4. Sticker đã sưu tập
  const totalPoolStickers=allStickers().length;
  const unlockedUnique=Object.keys(p.stickers||{}).length;
  const totalStickerCount=Object.values(p.stickers||{}).reduce((a,b)=>a+(b.count||1),0);

  // 5. Gợi ý nâng mức lượt chơi
  const recs=checkLevelUpRecommendation(pid,p);

  // 6. Lọc bảng chi tiết từ vựng
  const filteredWords=allWords.filter(w=>{
    const st=wStatsMap[w.id]||{level:0};

    {lv:0,title:'Mức 0 · Mới',desc:'Chưa học / Mới mở',cls:'lvl-0',color:'#868e96'},

  return `

      <span class="mut">Xem tiến độ của:</span>

      <button data-act="clearstats" data-id="${pid}" style="min-height:38px;padding:6px 12px;font-size:14px" title="Xóa lịch sử học của bé để học lại từ đầu">🗑️ Đặt lại thống kê</button>

  <!-- 1. Banner Gợi ý nâng mức lượt chơi (Khi bé hoàn thành 3 lượt liên tiếp dư thời gian & đúng chuẩn) -->

        <div style="font-size:18px;font-weight:700;color:#d94678">🌟 Gợi ý nâng mức cho ba mẹ!</div>

        <button data-act="dismissrec" data-k="${r.dismissKey}">Để sau</button>
      </div>
    </div>
  </div>`).join('')}

  <!-- 2. Tổng quan Thời gian học, Số lượt chơi & Bộ sưu tập Sticker -->
  <div class="stat-grid">
    <div class="box" style="margin:0;text-align:center;background:#fff9fb">
      <div class="mut">Hôm nay</div>
      <div style="font-size:28px;font-weight:700;color:#ff6b9d">${Math.max(1,Math.round(todaySec/60))} phút</div>
      <div class="mut" style="font-size:13px">${days7[6].cnt} lượt chơi</div>
    </div>
    <div class="box" style="margin:0;text-align:center;background:#f8f0fc">
      <div class="mut">7 ngày qua</div>
      <div style="font-size:28px;font-weight:700;color:#9b72f2">${Math.round(weekSec/60)} phút</div>
      <div class="mut" style="font-size:13px">${sessions.length} tổng lượt chơi</div>

      <div class="mut">Từ đã tiếp xúc</div>
      <div style="font-size:28px;font-weight:700;color:#0c8599">${totalW-lvCounts[0]} / ${totalW}</div>

    <div class="box" style="margin:0;text-align:center;background:#fff9db">

  <!-- 3. Phân bổ từ vựng theo 4 mức thuộc (Chạm vào thẻ để lọc danh sách bên dưới) -->
  <div class="box">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">📈 Số từ theo từng mức thuộc (Chạm để lọc)</h2>
      ${S.dashLvFilter!==null?`<button data-act="dashlv" data-lv="" style="min-height:34px;padding:4px 12px;font-size:14px">Hiện tất cả (${totalW})</button>`:''}

      ${lvMeta.map(m=>`<div style="width:${(lvCounts[m.lv]/totalW)*100}%;background:${m.color};transition:width .3s" title="${m.title}: ${lvCounts[m.lv]} từ"></div>`).join('')}

      ${lvMeta.map(m=>`<div class="stat-card ${S.dashLvFilter===m.lv?'active':''}" data-act="dashlv" data-lv="${m.lv}">

  <!-- 4. Danh sách "Từ bé hay nhầm" & "Từ cần luyện phát âm" (Kèm nút cho bé ôn ngay) -->

      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0;font-size:19px">🎧 Từ bé hay nhầm (${confusedWords.length})</h2>

      <p class="mut" style="font-size:13px;margin:4px 0 10px">Các từ bé từng cần "gỡ rối" bớt ảnh hoặc nhấp nháy gợi ý trong chế độ Nghe – Chạm:</p>
      ${confusedWords.length?`<div style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto">
        ${confusedWords.map(w=>{
          const st=wStatsMap[w.id]||{};

            </div>
            <button data-act="sayword" data-w="${esc(w.word)}" style="min-height:34px;padding:4px 10px">🔊</button>
          </div>`;
        }).join('')}
      </div>`:`<p class="mut" style="text-align:center;padding:16px 0">🎉 Tuyệt vời! Hiện chưa có từ nào bé bị nhầm nhiều lần.</p>`}
    </div>

    <div class="box" style="margin:0;border-left:6px solid #9b72f2">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0;font-size:19px">🎤 Từ cần luyện phát âm (${speakPracticeWords.length})</h2>
        ${speakPracticeWords.length?`<button class="sec" data-act="practicewatch" data-m="speak" data-ids="${speakPracticeWords.map(w=>w.id).join(',')}" style="min-height:38px;padding:6px 12px;font-size:14px">🎤 Luyện nói ngay</button>`:''}
      </div>
      <p class="mut" style="font-size:13px;margin:4px 0 10px">Các từ bé cần tách âm đọc chậm nhiều lượt hoặc qua ở lượt 3 động viên:</p>
      ${speakPracticeWords.length?`<div style="display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto">
        ${speakPracticeWords.map(w=>{
          const st=wStatsMap[w.id]||{};
          return `<div class="row" style="background:#f8f0fc;padding:6px 10px;border-radius:14px">
            ${renderWordVisual(w,42)}
            <div style="flex:1">
              <b>${esc(w.word)}</b> <span class="mut" style="font-size:13px">${esc(w.tts_slow||'')}</span>
              <div class="mut" style="font-size:12px">Pass sớm: <b>${st.speakPass||0}</b> · Tổng lượt thử mic: <b>${st.speakTries||0}</b></div>
            </div>
            <button data-act="sayword" data-w="${esc(w.word)}" style="min-height:34px;padding:4px 10px">🔊</button>
          </div>`;
        }).join('')}
      </div>`:`<p class="mut" style="text-align:center;padding:16px 0">🌟 Bé phát âm rất tự tin! Chưa có từ nào cần lưu ý thêm.</p>`}
    </div>
  </div>

  <!-- 5. Biểu đồ thời gian học 7 ngày qua & Tiến độ theo 13 Topic -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px">
    <div class="box" style="margin:0">
      <h2>🕒 Thời gian học 7 ngày gần nhất</h2>
      <div class="bar-chart">
        ${days7.map(d=>{
          const min=Math.round(d.sec/60);
          const hPct=d.sec>0?Math.max(12,Math.min(100,Math.round((min/maxDayMin)*100))):4;
          return `<div class="bar-col">
            <div style="font-size:12px;font-weight:700;color:#7649d4">${min?min+'p':''}</div>
            <div class="bar-fill" style="height:${hPct}%;opacity:${d.sec>0?1:.25}"></div>
            <div class="mut" style="font-size:12px">${d.lb}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="mut" style="font-size:13px;margin-top:8px;text-align:center">Khuyến nghị cho bé 3 tuổi: mỗi ngày chơi 1–2 lượt ngắn (5–10 phút) để bé luôn hào hứng.</div>
    </div>

    <div class="box" style="margin:0">
      <h2>🗂️ Tiến độ theo từng Topic (${allTopics.length})</h2>
      <div style="max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px">
        ${allTopics.map(t=>{
          const tw=allWords.filter(w=>w.topic_id===t.id);
          const seenCnt=tw.filter(w=>(wStatsMap[w.id]&&wStatsMap[w.id].level>0)).length;
          const mastCnt=tw.filter(w=>(wStatsMap[w.id]&&wStatsMap[w.id].level>=3)).length;
          const dueCnt=tw.filter(w=>{const st=wStatsMap[w.id];return st&&st.level>0&&(st.nextReview||0)<=now;}).length;
          const pct=tw.length?Math.round((seenCnt/tw.length)*100):0;
          return `<div style="font-size:14px">
            <div class="row" style="justify-content:space-between;margin-bottom:3px">
              <b>${esc(t.name_en)}</b>
              <span class="mut">Đã học: <b>${seenCnt}/${tw.length}</b> · Thuộc: <b style="color:#2b8a3e">${mastCnt}</b> ${dueCnt?`· <span style="color:#d94678">Đến hạn ôn: ${dueCnt}</span>`:''}</span>
            </div>
            <div style="height:8px;background:#f1f3f5;border-radius:99px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#ff6b9d,#3ec1d3)"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <!-- 6. Bảng tra cứu chi tiết từng từ & Bậc ảnh cao nhất bé đạt được -->
  <div class="box">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">🔍 Chi tiết từng từ vựng (${filteredWords.length} từ)</h2>
      <div class="row">
        <select id="dashTopicSel" style="width:auto;padding:7px 12px">
          <option value="">Tất cả Topic</option>
          ${allTopics.map(t=>`<option value="${esc(t.id)}" ${S.dashTopicFilter===t.id?'selected':''}>${esc(t.name_en)}</option>`).join('')}
        </select>
        <input id="dashSearchInp" placeholder="Tìm từ..." value="${esc(S.dashSearch)}" style="width:160px;padding:7px 12px">
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="dtbl">
        <thead>
          <tr>
            <th>Từ vựng</th>
            <th>Topic</th>
            <th>Mức thuộc</th>
            <th>Bậc ảnh cao nhất</th>
            <th>Nghe – Chạm (Đúng / Gỡ rối)</th>
            <th>Nhìn – Nói (Pass / Thử)</th>
            <th>Lịch ôn tập</th>
          </tr>
        </thead>
        <tbody>
          ${filteredWords.map(w=>{
            const st=wStatsMap[w.id]||{level:0,seen:0,firstTry:0,assisted:0,speakPass:0,speakTries:0,maxChoices:2,nextReview:0};
            const lv=st.level||0;
            const m=lvMeta[lv]||lvMeta[0];
            let revTxt='Chưa học';
            if(lv>0){
              const diffDays=Math.ceil(((st.nextReview||0)-now)/86400000);
              revTxt=diffDays<=0?'⚡ Hôm nay':`Còn ${diffDays} ngày`;
            }
            return `<tr>
              <td><div class="row" style="gap:8px">${renderWordVisual(w,36)} <b>${esc(w.word)}</b></div></td>
              <td class="mut">${esc(tname(w.topic_id))}</td>
              <td><span class="lvl-badge ${m.cls}">${m.title}</span></td>
              <td><b>${st.seen?((st.maxChoices||2)+' ảnh'):'-'}</b></td>
              <td><span style="color:#2b8a3e;font-weight:700">${st.firstTry||0}</span> / <span style="color:${st.assisted?'#d64545':'#868e96'}">${st.assisted||0}</span></td>
              <td><b>${st.speakPass||0}</b> / ${st.speakTries||0} ${st.needsPractice?'<span class="lvl-badge" style="background:#ffe3e3;color:#c92a2a">Cần luyện</span>':''}</td>
              <td style="font-size:13px;font-weight:700;color:${revTxt.includes('Hôm nay')?'#d94678':'#6c757d'}">${revTxt}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ----- Tab 6: Offline Cache, Xuất PWA & Hướng Dẫn Cài Đặt iPad (Mục 3.1, 3.6 & 6) ----- */
function tIpad(){
  const allW=(S.words&&S.words.length?S.words:buildDefaultWords()).filter(w=>w.active!==false);
  const activeUrls=[];
  allW.forEach(w=>imgs(w).forEach(im=>{if(im.url)activeUrls.push(tf(im.url));}));
  const cacheInfo=readLocalCache();
  const lastCacheTime=cacheInfo.updatedAt?new Date(cacheInfo.updatedAt).toLocaleString('vi-VN'):'Chưa lưu';

  return `
  <div class="box" style="background:linear-gradient(135deg,#e3fafc,#fff9db)">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2 style="margin:0">☁️ Trạng thái Offline & Bộ nhớ đệm trên iPad</h2>
        <p class="mut" style="margin:4px 0 0">Dữ liệu từ vựng, hồ sơ của bé Búp và bộ sưu tập sticker luôn được lưu song song trên máy. Khi mất mạng Wi-Fi, bé vẫn chơi bình thường và tự đồng bộ khi có mạng lại.</p>
      </div>
      <span class="net-pill ${S.online?'net-on':'net-off'}">${S.online?'🟢 Đang Online (Đã đồng bộ)':'🔴 Đang Offline (Lưu tại máy)'}</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="mint" data-act="precacheimgs" ${S.precache.running?'disabled':''}>
        📥 Tải sẵn ${activeUrls.length} ảnh vào bộ nhớ đệm iPad
      </button>
      <button data-act="dlmanifest">📄 Tải file manifest.json</button>
      <button data-act="dlsw">⚙️ Tải file sw.js (Service Worker)</button>
    </div>
    ${S.precache.total?`<div style="margin-top:10px">
      <div style="height:12px;background:#fff;border-radius:99px;overflow:hidden;border:2px solid var(--line)">
        <div style="width:${Math.round((S.precache.done/S.precache.total)*100)}%;height:100%;background:#3ec1d3;transition:width .2s"></div>
      </div>
      <div class="mut" style="font-size:14px;margin-top:4px">${esc(S.precache.msg)} (${S.precache.done}/${S.precache.total})</div>
    </div>`:`<div class="mut" style="font-size:13px;margin-top:8px">Lần lưu bộ nhớ đệm gần nhất: <b>${lastCacheTime}</b></div>`}
  </div>

  <div class="box">
    <h2>📱 Hướng dẫn 3 bước chuẩn bị iPad cho bé Búp tự học (Mục 3.1 & 3.6)</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px">
      <div class="box" style="margin:0;background:#fff9fb">
        <b style="color:#d94678;font-size:17px">1. Cài ra Màn hình chính (Toàn màn hình)</b>
        <p style="font-size:15px;margin:8px 0 0">Mở trang web này bằng <b>Safari</b> trên iPad → chạm biểu tượng <b>Chia sẻ (Share)</b> ở thanh trên cùng → chọn <b>Thêm vào Màn hình chính (Add to Home Screen)</b>. Khi mở từ biểu tượng ngoài màn hình, app sẽ chạy toàn màn hình không còn thanh địa chỉ.</p>
      </div>
      <div class="box" style="margin:0;background:#f8f0fc">
        <b style="color:#7649d4;font-size:17px">2. Tải giọng đọc tiếng Anh Mỹ tự nhiên (Enhanced)</b>
        <p style="font-size:15px;margin:8px 0 0">Vào <b>Cài đặt (Settings)</b> của iPad → <b>Trợ năng (Accessibility)</b> → <b>Nội dung được đọc (Spoken Content)</b> → <b>Giọng nói (Voices)</b> → <b>Tiếng Anh (English)</b> → tải giọng <b>Samantha (Enhanced)</b> hoặc <b>Ava (Premium)</b>. App sẽ tự động ưu tiên chọn giọng đọc ấm áp này cho bé.</p>
      </div>
      <div class="box" style="margin:0;background:#fff9db">
        <b style="color:#d97706;font-size:17px">3. Khóa Guided Access để bé không thoát nhầm</b>
        <p style="font-size:15px;margin:8px 0 0">Vào <b>Cài đặt → Trợ năng → Truy cập được hướng dẫn (Guided Access)</b> và bật lên. Mỗi khi đưa iPad cho bé Búp chơi, ba mẹ mở app rồi <b>nhấn 3 lần nút Nguồn (hoặc nút Home)</b> để khóa cố định trong app.</p>
      </div>
    </div>
  </div>`;
}

/* ----- Đọc file CSV/JSON ----- */
function csvRows(t,d){
  const r=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(c);c=''}
    else if(ch==='\n'){row.push(c);r.push(row);row=[];c=''}
    else if(ch!=='\r')c+=ch;
  }
  if(c||row.length){row.push(c);r.push(row)}
  return r.filter(x=>x.some(y=>y.trim()));
}
function fromCsv(t){
  const f=t.split('\n')[0],d=f.split(';').length>f.split(',').length?';':',';
  const rows=csvRows(t,d);if(rows.length<2)throw new Error('file không có dữ liệu');
  const h=rows[0].map(x=>x.trim().toLowerCase()),col=n=>h.indexOf(n);
  return rows.slice(1).map(r=>{
    const g=n=>col(n)>-1?(r[col(n)]||'').trim():'';
    return {word:g('word'),topic:g('topic'),imgs:[g('image_url'),g('image_url_2'),g('image_url_3')],level:parseInt(g('level'))||0,tts:g('tts_slow'),variants:g('variants').split('|').map(x=>x.trim()).filter(Boolean),audio:g('audio_url')};
  });
}
function fromJson(o){
  const tn={};arr(o.topics).forEach(t=>tn[t.id]=t.name_en);
  return (Array.isArray(o)?o:arr(o.words)).map(w=>{
    const im=arr(w.images).map(i=>i.url||'');
    return {word:w.word||'',topic:w.topic||tn[w.topic_id]||w.topic_id||'',imgs:[im[0]||'',im[1]||'',im[2]||''],level:w.level||0,tts:w.tts_slow||'',variants:arr(w.variants),audio:w.audio_url||''};
  });
}
function prep(rows){
  const seen={},have={};(S.words||[]).forEach(w=>have[w.id||slug(w.word)]=1);
  rows.forEach(r=>{
    r.word=(r.word||'').trim();r.topic=(r.topic||'').trim();r.id=slug(r.word);r.err=[];r.warn=[];r.ok=[null,null,null];
    if(!r.word)r.err.push('thiếu từ');
    else if(seen[r.id])r.err.push('trùng trong file');
    seen[r.id]=1;
    if(!r.topic)r.err.push('thiếu topic');
    r.imgs.forEach((u,i)=>{if(u&&!/^https?:\/\//i.test(u)){r.err.push('link ảnh '+(i+1)+' không hợp lệ')}});
    r.isNew=!have[r.id];
  });
  return rows;
}
const chk=u=>new Promise(res=>{
  const i=new Image(),t=setTimeout(()=>res(false),8000);
  i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=tf(u);
});
async function checkImgs(){
  const m=S.imp,jobs=[];
  m.rows.forEach(r=>r.imgs.forEach((u,i)=>{if(u&&/^https?:\/\//i.test(u))jobs.push([r,i])}));
  m.total=jobs.length;m.done=0;let k=0;
  const work=async()=>{while(k<jobs.length&&S.imp===m){const j=jobs[k++];j[0].ok[j[1]]=await chk(j[0].imgs[j[1]]);m.done++;if((m.done%5===0||m.done===m.total)&&S.view==='admin'&&S.tab==='import')render()}};
  await Promise.all([1,2,3,4,5,6].map(work));
  if(S.imp===m&&S.view==='admin')render();
}

/* ----- Lưu lên Firebase & Bộ nhớ đệm Offline ----- */
async function saveNode(path,data){
  if(path==='words')writeLocalCache({words:data});
  if(path==='topics')writeLocalCache({topics:data});
  try{await set(ref(db,path),clean(data));S.perm=false;return true}
  catch(e){
    if(/permission/i.test(e.message))S.perm=true;
    S.words=null;await loadWords();render();return false;
  }
}
const saveW=()=>saveNode('words',S.words),saveT=()=>saveNode('topics',S.topics);
function dl(name,text,type,bom){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([(bom?'\ufeff':'')+text],{type}));
  a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
}

/* ----- Nhấn giữ biểu tượng ổ khóa 3 giây hoặc giải phép tính (Mục 5) ----- */
let lockHoldTimer=null;
function bindLockLongPress(){
  const btn=document.getElementById('lockBtn');if(!btn)return;
  const startHold=()=>{
    clearTimeout(lockHoldTimer);
    lockHoldTimer=setTimeout(()=>{
      lockHoldTimer=null;
      playTing();go('admin');
    },2800);
  };
  const cancelHold=()=>{if(lockHoldTimer){clearTimeout(lockHoldTimer);lockHoldTimer=null;}};
  btn.addEventListener('touchstart',startHold,{passive:true});
  btn.addEventListener('touchend',cancelHold);
  btn.addEventListener('touchcancel',cancelHold);
  btn.addEventListener('mousedown',startHold);
  btn.addEventListener('mouseup',cancelHold);
  btn.addEventListener('mouseleave',cancelHold);
}

/* ---------- Tải Dữ liệu từ Firebase (Kèm dự phòng Offline Cache) ---------- */
async function loadProfiles(){
  const cache=readLocalCache();
  try{
    const remoteProf=await val('users/'+S.user.uid+'/profiles');
    if(remoteProf&&Object.keys(remoteProf).length){
      S.profiles=remoteProf;
      writeLocalCache({profiles:S.profiles});
    }else if(cache.profiles&&Object.keys(cache.profiles).length){
      S.profiles=cache.profiles;
    }else{
      // Tự động khởi tạo hồ sơ mặc định tên Búp khi tài khoản mới đăng nhập lần đầu
      const bup={
        name:'Búp',avatar:'👧',mascot:'princess',created:Date.now(),
        settings:{listenPreset:'easy',speakPreset:'easy',maxChoices:8,speechLenience:'very_easy',micMode:'auto',slowRate:0.6},
        stickers:{stk_crown:{got_at:Date.now(),count:1},stk_sheriff:{got_at:Date.now(),count:1}}
      };
      S.profiles={bup_default:bup};
      writeLocalCache({profiles:S.profiles});
      set(ref(db,'users/'+S.user.uid+'/profiles/bup_default'),clean(bup)).catch(()=>{});
    }
  }catch(e){
    S.profiles=cache.profiles||{};
  }
  try{S.cfg=await val('users/'+S.user.uid+'/settings')||cache.cfg||{};writeLocalCache({cfg:S.cfg});}catch(e){S.cfg=cache.cfg||{}}
  try{S.customStickers=arr(await val('users/'+S.user.uid+'/customStickers'));writeLocalCache({customStickers:S.customStickers});}catch(e){S.customStickers=arr(cache.customStickers)}
}
async function loadWords(){
  S.err='';
  const cache=readLocalCache();
  try{
    const r=await Promise.all([val('words'),val('topics')]);
    S.words=arr(r[0]);S.topics=arr(r[1]);
    if(!S.topics.length)S.topics=arr(cache.topics).length?arr(cache.topics):clean(DEFAULT_TOPICS);
    if(!S.words.length)S.words=arr(cache.words).length?arr(cache.words):buildDefaultWords();
    writeLocalCache({words:S.words,topics:S.topics});
  }catch(e){
    S.words=arr(cache.words).length?arr(cache.words):buildDefaultWords();
    S.topics=arr(cache.topics).length?arr(cache.topics):clean(DEFAULT_TOPICS);
    S.err=/permission/i.test(e.message)?'perm':e.message;
  }
}
async function go(v){
  stopTimer();S.view=v;S.gate=null;render();
  if((v==='admin'||v==='home'||v==='topics')&&S.words===null){await loadWords();render()}
}

    const u=[0,1,2].map(i=>ex(document.getElementById('ei'+i).value.trim()));
    const lv=+document.getElementById('el').value,ts=document.getElementById('es').value.trim();
    const old=S.edit>=0?S.words[S.edit]:null,oi=old?arr(old.images):[];
    const images=[0,1,2].map(i=>({slot:i+1,public_id:(oi[i]&&oi[i].public_id)||'',url:u[i],active:!!u[i]&&!(oi[i]&&oi[i].url===u[i]&&oi[i].active===false)}));
    if(old)Object.assign(old,{word,topic_id:tid,level:lv,tts_slow:ts,images});
    else{
      const id=slug(word);if(S.words.some(w=>w.id===id))return;
      S.words.push({id,word,topic_id:tid,wave:0,level:lv,audio_url:'',tts_slow:ts,variants:[],active:true,images});
    }
    S.edit=null;if(await saveW())render();
  },
  sample(){
    dl('mau-nhap-tu.csv','word,topic,image_url,image_url_2,image_url_3,level,tts_slow,variants\ndog,Pets & Farm Animals,dog1.jpg,dog2.jpg,,1,,dug|dock\nelephant,Wild Animals,,,,3,el... e... phant,elefant\nice cream,Food & Drink,,,,3,ice... cream,\n','text/csv',true);
  },
  expo(){dl('words-export.json',JSON.stringify({topics:S.topics,words:S.words},null,1),'application/json',false)},
  async doimp(){
    const m=S.imp,good=m.rows.filter(r=>!r.err.length);if(!good.length)return;
    good.forEach(r=>{
      let t=S.topics.find(t=>(t.name_en||'').toLowerCase()===r.topic.toLowerCase()||t.id===slug(r.topic));
      if(!t){t={id:slug(r.topic)||('t'+Date.now()),name_en:r.topic,icon_word:r.id,order:S.topics.length+1,wave:0,active:true};S.topics.push(t)}
      const w=S.words.find(x=>(x.id||slug(x.word))===r.id),old=w?arr(w.images):[];
      const images=[0,1,2].map(i=>{
        const o=old[i]||{public_id:'',url:'',active:false};
        const miss=r.auto&&r.auto[i]&&r.ok[i]===false;
        if(r.imgs[i]&&!miss)return {slot:i+1,public_id:o.public_id||'',url:r.imgs[i],active:r.ok[i]!==false};
        return {slot:i+1,public_id:o.public_id||'',url:o.url||'',active:!!o.url&&o.active!==false};
      });
      if(w){
        w.word=r.word;w.topic_id=t.id;w.images=images;
        if(r.level)w.level=r.level;if(r.tts)w.tts_slow=r.tts;if(r.variants.length)w.variants=r.variants;if(r.audio)w.audio_url=r.audio;
      }else{
        S.words.push({id:r.id,word:r.word,topic_id:t.id,wave:0,level:r.level||2,audio_url:r.audio||'',tts_slow:r.tts||'',variants:r.variants,active:true,images});
      }
    });
    if(await saveT()&&await saveW()){S.imp=null;S.tab='words';render()}
  }
};

app.addEventListener('change',async e=>{
  if(e.target.id==='tfs'){S.tfil=e.target.value;render()}
  if(e.target.id==='dashTopicSel'){S.dashTopicFilter=e.target.value;render()}
  if(e.target.dataset.act==='pset'){
    const pid=e.target.dataset.id,k=e.target.dataset.k;
    const numKeys=['maxChoices','listenCustomWords','listenCustomSec','speakCustomWords','speakCustomSec','slowRate'];
    const v=numKeys.includes(k)?+e.target.value:e.target.value;
    const p=S.profiles[pid];
    if(p){
      if(!p.settings)p.settings={};
      p.settings[k]=v;
      writeLocalCache({profiles:S.profiles});
      update(ref(db,'users/'+S.user.uid+'/profiles/'+pid+'/settings'),clean(p.settings)).catch(()=>{});
      render();
    }
  }
  if(e.target.id==='fi'&&e.target.files[0]){
    try{
      const t=(await e.target.files[0].text()).replace(/^\ufeff/,'');
      const rows=/^\s*[\[{]/.test(t)?fromJson(JSON.parse(t)):fromCsv(t);
      let base=document.getElementById('ib').value.trim()||DEFBASE;if(base.slice(-1)!=='/')base+='/';
      const c={base,auto:document.getElementById('ia').checked,n:+document.getElementById('in').value,ext:document.getElementById('ix').value.trim().replace(/^\./,'')};
      S.cfg={imageBase:c.base,autoImg:c.auto,autoN:c.n,autoExt:c.ext};
      update(ref(db,'users/'+S.user.uid+'/settings'),S.cfg).catch(()=>{});
      S.imp={rows:prep(fillImgs(rows,c)),total:0,done:0};render();checkImgs();
    }catch(x){}
  }
});
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&act[t.dataset.act])act[t.dataset.act](t.dataset,t)});
app.addEventListener('input',e=>{
  if(e.target.id==='dashSearchInp'){
    S.dashSearch=e.target.value;
    const pos=e.target.selectionStart;
    render();
    const inp=document.getElementById('dashSearchInp');
    if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(err){}}
  }
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gv')act.gok()});

/* ---------- Nút giữ 1 giây (tránh bé bấm nhầm thoát) ---------- */
let holdT=null;
app.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-hold]');if(!h)return;
  h.classList.add('holding');
  holdT=setTimeout(()=>{holdT=null;h.classList.remove('holding');const f=act[h.dataset.hold];if(f)f(h.dataset,h)},1000);
});
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>{
  if(!holdT)return;clearTimeout(holdT);holdT=null;
  const h=document.querySelector('.holding');
  if(h){h.classList.remove('holding');h.classList.add('nudge');setTimeout(()=>h.classList.remove('nudge'),450)}
}));

/* ---------- Khởi động ---------- */
render();
onAuthStateChanged(auth,async u=>{
  S.user=u;S.words=null;
  if(!u){S.profiles={};S.cur=null;S.err='';go('login');return}
  await loadProfiles();
  await loadWords();
  go(Object.keys(S.profiles).length?'pick':'admin');
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
