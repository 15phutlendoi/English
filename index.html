function speak(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;
    const sc=v=>(v.lang==='en-US'?2:0)+(/Samantha|Ava|Allison|Zoe|Nicky|Siri|Enhanced|Premium/i.test(v.name)?3:0);
    const BAD=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy/i;
    const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!BAD.test(v.name)).sort((a,b)=>sc(b)-sc(a))[0];
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ----- Đọc file nhập ----- */
function csvRows(t,d){
  const r=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(c);c=''}
    else if(ch==='\n'){row.push(c);r.push(row);row=[];c=''}
    else if(ch!=='\r')c+=ch;
  }
  if(c||row.length){row.push(c);r.push(row)}
  return r.filter(x=>x.some(y=>y.trim()));
}
function fromCsv(t){
  const f=t.split('\n')[0],d=f.split(';').length>f.split(',').length?';':',';
  const rows=csvRows(t,d);if(rows.length<2)throw new Error('file không có dữ liệu');
  const h=rows[0].map(x=>x.trim().toLowerCase()),col=n=>h.indexOf(n);
  return rows.slice(1).map(r=>{
    const g=n=>col(n)>-1?(r[col(n)]||'').trim():'';
    return {word:g('word'),topic:g('topic'),imgs:[g('image_url'),g('image_url_2'),g('image_url_3')],level:parseInt(g('level'))||0,tts:g('tts_slow'),variants:g('variants').split('|').map(x=>x.trim()).filter(Boolean),audio:g('audio_url')};
  });
}
function fromJson(o){
  const tn={};arr(o.topics).forEach(t=>tn[t.id]=t.name_en);
  return (Array.isArray(o)?o:arr(o.words)).map(w=>{
    const im=arr(w.images).map(i=>i.url||'');
    return {word:w.word||'',topic:w.topic||tn[w.topic_id]||w.topic_id||'',imgs:[im[0]||'',im[1]||'',im[2]||''],level:w.level||0,tts:w.tts_slow||'',variants:arr(w.variants),audio:w.audio_url||''};
  });
}
function prep(rows){
  const seen={},have={};(S.words||[]).forEach(w=>have[w.id||slug(w.word)]=1);
  rows.forEach(r=>{
    r.word=(r.word||'').trim();r.topic=(r.topic||'').trim();r.id=slug(r.word);r.err=[];r.warn=[];r.ok=[null,null,null];
    if(!r.word)r.err.push('thiếu từ');
    else if(seen[r.id])r.err.push('trùng trong file');
    seen[r.id]=1;
    if(!r.topic)r.err.push('thiếu topic');
    r.imgs.forEach((u,i)=>{if(u&&!/^https?:\/\//i.test(u)){r.err.push('link ảnh '+(i+1)+' không hợp lệ')}});
    if(!r.imgs.some(Boolean))r.warn.push('chưa có ảnh');
    r.isNew=!have[r.id];
  });
  return rows;
}
const chk=u=>new Promise(res=>{
  const i=new Image(),t=setTimeout(()=>res(false),8000);
  i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=tf(u);
});
async function checkImgs(){
  const m=S.imp,jobs=[];
  m.rows.forEach(r=>r.imgs.forEach((u,i)=>{if(u&&/^https?:\/\//i.test(u))jobs.push([r,i])}));
  m.total=jobs.length;m.done=0;let k=0;
  const work=async()=>{while(k<jobs.length&&S.imp===m){const j=jobs[k++];j[0].ok[j[1]]=await chk(j[0].imgs[j[1]]);m.done++;if((m.done%5===0||m.done===m.total)&&S.view==='admin'&&S.tab==='import')render()}};
  await Promise.all([1,2,3,4,5,6].map(work));
  if(S.imp===m&&S.view==='admin')render();
}

/* ----- Lưu lên Firebase ----- */
async function saveNode(path,data){
  try{await set(ref(db,path),clean(data));S.perm=false;return true}
  catch(e){
    if(/permission/i.test(e.message))S.perm=true;else alert('Không lưu được: '+e.message);
    S.words=null;await loadWords();render();return false;
  }
}
const saveW=()=>saveNode('words',S.words),saveT=()=>saveNode('topics',S.topics);
function dl(name,text,type,bom){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([(bom?'\ufeff':'')+text],{type}));
  a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
}

function render(){
  const V={boot:()=>'<div class="wrap" style="text-align:center;margin-top:30vh"><div class="big">🐾</div></div>',login:vLogin,pick:vPick,home:vHome,admin:vAdmin};
  app.innerHTML=V[S.view]();

async function loadProfiles(){
  try{S.profiles=await val('users/'+S.user.uid+'/profiles')||{}}catch(e){S.profiles={}}
}
async function loadWords(){
  S.err='';
  try{const r=await Promise.all([val('words'),val('topics')]);S.words=arr(r[0]);S.topics=arr(r[1])}
  catch(e){S.words=[];S.topics=[];S.err=/permission/i.test(e.message)?'perm':e.message}
}
async function go(v){
  S.view=v;render();
  if(v==='admin'&&S.words===null){await loadWords();if(S.view==='admin')render()}
}

    try{await signInWithEmailAndPassword(auth,em,pw)}
    catch(e){
      const m={'auth/invalid-credential':'Email hoặc mật khẩu chưa đúng','auth/invalid-email':'Email chưa hợp lệ','auth/network-request-failed':'Không có kết nối mạng','auth/too-many-requests':'Thử quá nhiều lần, hãy đợi một lúc'};
      document.getElementById('err').textContent=m[e.code]||('Lỗi: '+e.code);
    }
  },
  who(d){S.cur=d.id;speak('Hello!');go('home')},
  back(){S.cur=null;go('pick')},
  soon(d,el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');speak('Coming soon!')},
  exit(){go(Object.keys(S.profiles).length?'pick':'admin')},
  av(d){const n=document.getElementById('nn');S.newName=n?n.value:'';S.newAv=d.v;render()},
  async add(){
    const name=document.getElementById('nn').value.trim();
    if(!name){alert('Hãy nhập tên bé');return}
    try{
      const k=push(ref(db,'users/'+S.user.uid+'/profiles')).key;
      const p={name:name,avatar:S.newAv,created:Date.now(),settings:{listenPreset:'easy',speakPreset:'easy',maxChoices:8,mic:true}};
      await set(ref(db,'users/'+S.user.uid+'/profiles/'+k),p);
      S.profiles[k]=p;S.newName='';render();
    }catch(e){alert('Không lưu được: '+e.message)}
  },
  async ren(d){
    const p=S.profiles[d.id];const n=prompt('Tên mới cho bé:',p.name);
    if(n&&n.trim()){try{await update(ref(db,'users/'+S.user.uid+'/profiles/'+d.id),{name:n.trim()});p.name=n.trim();render()}catch(e){alert(e.message)}}
  },
  async del(d){
    if(!confirm('Xóa hồ sơ "'+S.profiles[d.id].name+'"? Kết quả học của bé cũng sẽ mất.'))return;
    try{await remove(ref(db,'users/'+S.user.uid+'/profiles/'+d.id));delete S.profiles[d.id];render()}catch(e){alert(e.message)}
  },
  async reload(){S.words=null;render();await loadWords();render()},
  async out(){await signOut(auth)}
};
Object.assign(act,{
  tab(d){S.tab=d.v;S.edit=null;render()},
  nw(){S.edit=-1;render()},
  ew(d){S.edit=+d.i;render()},
  cw(){S.edit=null;render()},
  async tw(d){const w=S.words[+d.i];w.active=w.active===false;await saveW();render()},
  async dw(d){const w=S.words[+d.i];if(!confirm('Xóa từ "'+w.word+'"?'))return;S.words.splice(+d.i,1);await saveW();render()},
  async tt(d){const t=S.topics[+d.i];t.active=t.active===false;await saveT();render()},
  async rt(d){const t=S.topics[+d.i],n=prompt('Tên topic mới:',t.name_en);if(n&&n.trim()){t.name_en=n.trim();await saveT();render()}},
  async at(){
    const n=prompt('Tên topic mới (tiếng Anh):');if(!n||!n.trim())return;
    const id=slug(n);if(!id||S.topics.some(t=>t.id===id)){alert('Topic này đã có hoặc tên chưa hợp lệ');return}
    S.topics.push({id,name_en:n.trim(),icon_word:'',order:S.topics.length+1,wave:0,active:true});await saveT();render();
  },
  async sw(){
    const word=document.getElementById('ew').value.trim(),tid=document.getElementById('et').value;
    if(!word){alert('Hãy nhập từ tiếng Anh');return}
    if(!tid){alert('Cần tạo topic trước');return}
    const u=[0,1,2].map(i=>document.getElementById('ei'+i).value.trim());
    const lv=+document.getElementById('el').value,ts=document.getElementById('es').value.trim();
    const old=S.edit>=0?S.words[S.edit]:null,oi=old?arr(old.images):[];
    const images=[0,1,2].map(i=>({slot:i+1,public_id:(oi[i]&&oi[i].public_id)||'',url:u[i],active:!!u[i]&&!(oi[i]&&oi[i].url===u[i]&&oi[i].active===false)}));
    if(old)Object.assign(old,{word:word,topic_id:tid,level:lv,tts_slow:ts,images:images});
    else{
      const id=slug(word);if(S.words.some(w=>w.id===id)){alert('Từ này đã có');return}
      S.words.push({id:id,word:word,topic_id:tid,wave:0,level:lv,audio_url:'',tts_slow:ts,variants:[],active:true,images:images});
    }
    S.edit=null;if(await saveW())render();
  },
  sample(){
    const u='https://res.cloudinary.com/tgvj8prc/image/upload/';
    dl('mau-nhap-tu.csv','word,topic,image_url,image_url_2,image_url_3,level,tts_slow,variants\ndog,Pets & Farm Animals,'+u+'v1794906354/dog1.jpg,'+u+'v1794906354/dog2.jpg,,1,,dug|dock\nelephant,Wild Animals,'+u+'v0000000000/elephant1.jpg,,,3,el... e... phant,elefant\nice cream,Food & Drink,'+u+'v0000000000/icecream1.jpg,,,3,ice... cream,\n','text/csv',true);
  },
  expo(){dl('words-export.json',JSON.stringify({topics:S.topics,words:S.words},null,1),'application/json',false)},
  async doimp(){
    const m=S.imp,good=m.rows.filter(r=>!r.err.length);if(!good.length)return;
    let add=0,upd=0;
    good.forEach(r=>{
      let t=S.topics.find(t=>(t.name_en||'').toLowerCase()===r.topic.toLowerCase()||t.id===slug(r.topic));
      if(!t){t={id:slug(r.topic)||('t'+Date.now()),name_en:r.topic,icon_word:r.id,order:S.topics.length+1,wave:0,active:true};S.topics.push(t)}
      const w=S.words.find(x=>(x.id||slug(x.word))===r.id),old=w?arr(w.images):[];
      const images=[0,1,2].map(i=>{
        const o=old[i]||{public_id:'',url:'',active:false};
        if(r.imgs[i])return {slot:i+1,public_id:o.public_id||'',url:r.imgs[i],active:r.ok[i]!==false};
        return {slot:i+1,public_id:o.public_id||'',url:o.url||'',active:!!o.url&&o.active!==false};
      });
      if(w){
        w.word=r.word;w.topic_id=t.id;w.images=images;
        if(r.level)w.level=r.level;if(r.tts)w.tts_slow=r.tts;if(r.variants.length)w.variants=r.variants;if(r.audio)w.audio_url=r.audio;
        upd++;
      }else{
        S.words.push({id:r.id,word:r.word,topic_id:t.id,wave:0,level:r.level||2,audio_url:r.audio||'',tts_slow:r.tts||'',variants:r.variants,active:true,images:images});add++;
      }
    });
    if(await saveT()&&await saveW()){S.imp=null;S.tab='words';render();alert('Đã thêm '+add+' từ mới và cập nhật '+upd+' từ.')}
  }
});
app.addEventListener('change',async e=>{
  if(e.target.id==='tfs'){S.tfil=e.target.value;render()}
  if(e.target.id==='fi'&&e.target.files[0]){
    try{
      const t=(await e.target.files[0].text()).replace(/^\ufeff/,'');
      const rows=/^\s*[\[{]/.test(t)?fromJson(JSON.parse(t)):fromCsv(t);
      S.imp={rows:prep(rows),total:0,done:0};render();checkImgs();
    }catch(x){alert('Không đọc được file: '+x.message)}
  }
});
app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&act[t.dataset.act])act[t.dataset.act](t.dataset,t)});

/* Giữ nút khóa 3 giây để vào khu phụ huynh */
let gt=0;
app.addEventListener('pointerdown',e=>{if(e.target.closest('#lock'))gt=setTimeout(()=>go('admin'),3000)});
['pointerup','pointercancel','pointerleave'].forEach(n=>app.addEventListener(n,()=>clearTimeout(gt),true));

/* ---------- Khởi động ---------- */
render();
onAuthStateChanged(auth,async u=>{
  S.user=u;S.words=null;
  if(!u){S.profiles={};S.cur=null;S.err='';go('login');return}
  await loadProfiles();
  go(Object.keys(S.profiles).length?'pick':'admin');
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
