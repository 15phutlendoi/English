  async addbulk(){
    const g=id=>document.getElementById(id);
    let base=g('bkb').value.trim();if(base&&base.slice(-1)!=='/')base+='/';
    const pre=g('bkp').value.trim(),ext=g('bkx').value.trim().replace(/^\./,'')||'png';
    const from=parseInt(g('bka').value,10),to=parseInt(g('bkz').value,10);
    const label=g('bkn').value.trim()||pre.replace(/[_\-\s]+$/,''),rarity=g('bkr').value;
    if(!/^https?:\/\//i.test(base)||!pre||!(from>=0)||!(to>=from)){S.bulkMsg='⚠️ Kiểm tra lại: thư mục (https://…), tên file, và số bắt đầu ≤ số kết thúc.';render();return}
    if(to-from>=500){S.bulkMsg='⚠️ Mỗi lần thêm tối đa 500 sticker.';render();return}
    const key=pre.replace(/[.#$\[\]\/\s]/g,'-');
    const have=new Set(arr(S.customStickers).map(x=>x.url));
    let added=0,skipped=0;
    for(let n=from;n<=to;n++){
      const url=`${base}${pre}${n}.${ext}`;
      if(have.has(url)){skipped++;continue}
      S.customStickers.push({id:`bulk_${key}${n}`,name:`${label} ${n}`,url,rarity,group:'Family',batch:pre});
      added++;
    }
    writeLocalCache({customStickers:S.customStickers});
    S.bulkMsg=`✅ Đã thêm ${added} sticker (${pre}${from}.${ext} → ${pre}${to}.${ext})${skipped?`, bỏ qua ${skipped} sticker đã có`:''}.`;
    try{await set(ref(db,'users/'+S.user.uid+'/customStickers'),clean(S.customStickers))}
    catch(e){S.bulkMsg+=' ⚠️ Chưa lưu được lên mạng, sẽ lưu tạm trên máy.';S.pendingSync=true}

/* ---------- Hiệu ứng tương tác: tia sáng khi chạm, nổ sao khi trả lời đúng, nền trôi nhẹ ---------- */
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function burst(x,y,n=5,glyphs=['⭐','💗','✨','🌸']){
  const fx=document.getElementById('fxLayer');if(!fx||calm)return;
  for(let i=0;i<n;i++){
    const e=document.createElement('span'),a=Math.random()*6.283,d=40+Math.random()*70;
    e.className='spark';e.textContent=glyphs[(Math.random()*glyphs.length)|0];
    e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px;font-size:${14+Math.random()*14}px`;
    fx.appendChild(e);setTimeout(()=>e.remove(),800);
  }
}
app.addEventListener('pointerdown',e=>{if(!e.target.closest('input,select,textarea,[data-hold]'))burst(e.clientX,e.clientY,5)});
new MutationObserver(()=>{
  app.querySelectorAll('.correct-flash:not([data-b])').forEach(el=>{
    el.dataset.b='1';const r=el.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,14,['⭐','🌟','💖','✨','🎀']);
  });
}).observe(app,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
if(!calm){
  const bg=document.createElement('div');bg.id='bgFx';
  const g=['💗','✨','⭐','🌸','🎀','🦋','💖','✨','🌷'];
  g.forEach((c,i)=>{const sp=document.createElement('span');sp.textContent=c;
    sp.style.cssText=`left:${6+i*10.5}%;font-size:${20+(i%3)*8}px;animation-duration:${16+(i*3)%11}s;animation-delay:${-i*2.3}s`;bg.appendChild(sp)});
  document.body.prepend(bg);
}

const CAT_POSES=(()=>{const o={};for(const k in CAT_B64){try{const bin=atob(CAT_B64[k]),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);o[k]=URL.createObjectURL(new Blob([u8],{type:'image/webp'}));}catch(e){o[k]='data:image/webp;base64,'+CAT_B64[k];}}return o;})();
Object.values(CAT_POSES).forEach(u=>{const im=new Image();im.src=u;if(im.decode)im.decode().catch(()=>{});});
const catMarkup=()=>`<div class="cat-stack">${['sit','crouch','jump','run'].map(k=>`<img class="cat-img${k==='sit'?' on':''}" data-pose="${k}" alt="${k==='sit'?'Kitty':''}" draggable="false" src="${CAT_POSES[k]}">`).join('')}</div>`;
const FISH_SVG=`<svg viewBox="0 0 46 32"><g class="steam" fill="none" stroke="#e8b4c8" stroke-width="2" stroke-linecap="round"><path d="M15 9q-3 -3 0 -6"/><path d="M24 8q-3 -3 0 -6"/><path d="M32 9q-3 -3 0 -6"/></g>
  <ellipse cx="23" cy="27" rx="21" ry="4.5" fill="#fff" stroke="#f3c6da" stroke-width="1.5"/>
  <g class="fsh"><polygon points="35,18 44,10 44,24" fill="#e8892b"/><ellipse cx="22" cy="18" rx="15" ry="8" fill="#f2a63b" stroke="#d9822b" stroke-width="1.5"/>
  <path d="M20 12q3 6 0 12M26 12q3 6 0 12" fill="none" stroke="#d9822b" stroke-width="1.3" stroke-linecap="round"/><circle cx="12" cy="16" r="2.4" fill="#fff"/><circle cx="11.4" cy="16" r="1.2" fill="#4a2748"/></g></svg>`;
let catPos=null;
const CAT_W=84,CAT_RESERVE=CAT_W+40;   // chừa 40px phía cuối thanh cho đĩa cá
const catLeft=p=>`calc((100% - ${CAT_RESERVE}px) * ${(p/100).toFixed(4)})`;
const catInit=pct=>(catPos!=null&&catPos<=pct)?catPos:pct;
(async function catLoop(){
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const KEY={'c-sit':'sit','c-crouch':'crouch','c-jump':'jump','c-step':'run'};
  const same=c=>document.getElementById('pBarPup')===c;
  // Đổi tư thế: ảnh mới hiện đè lên ảnh cũ (cùng khung, cùng mặt đất) rồi ảnh cũ mới tắt => không có khoảnh khắc "hở" giữa hai tư thế
  const pose=(c,n)=>{
    c.classList.remove('c-sit','c-crouch','c-jump','c-step');c.classList.add(n);
    const next=c.querySelector('.cat-img[data-pose="'+KEY[n]+'"]'),cur=c.querySelector('.cat-img.on');
    if(!next||next===cur)return;
    c.querySelectorAll('.cat-img.prev').forEach(i=>i.classList.remove('prev'));
    if(cur){cur.classList.remove('on');cur.classList.add('prev');setTimeout(()=>cur.classList.remove('prev'),130)}
    next.classList.add('on');
  };
  const tgtOf=()=>{const b=document.getElementById('pBarFill');return b?(parseFloat(b.style.width)||0):null};
  for(;;){
    const c=document.getElementById('pBarPup'),t=tgtOf();
    if(!c||t==null){catPos=null;await wait(400);continue}
    if(catPos==null||t<catPos)catPos=t;
    const W=Math.max(1,c.parentElement.clientWidth-CAT_RESERVE);
    if((t-catPos)/100*W<56){await wait(400);continue}            // 1. Ngồi chờ đến khi tiến trình đi được một quãng
    pose(c,'c-crouch');await wait(360);                             // 2. Lấy đà: hạ thấp người, đầu chúi về phía trước
    if(!same(c))continue;
    const mid=catPos+Math.min((t-catPos)/100*W*.5,120)/W*100;
    pose(c,'c-jump');c.style.transition='left .6s cubic-bezier(.25,.6,.35,1)';c.style.left=catLeft(mid);
    await wait(600);if(!same(c))continue;                           // 3. Nhảy tới
    const t2=Math.max(tgtOf()??t,mid),dur=Math.min(2.4,Math.max(.6,(t2-mid)/100*W/90));
    pose(c,'c-step');c.style.transition=`left ${dur}s linear`;c.style.left=catLeft(t2);
    await wait(dur*1000+60);catPos=t2;if(!same(c))continue;         // 4. Đi nốt quãng còn lại
    pose(c,'c-sit');c.style.transition='left .22s';
    await wait(1300);                                               // Ngồi lại
  }
})();

try{speechSynthesis.addEventListener('voiceschanged',()=>{if(S.view==='admin'&&S.tab==='voice')render()})}catch(e){}

let holdT=null;
app.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-hold]');if(!h)return;
  h.classList.add('holding');
  holdT=setTimeout(()=>{holdT=null;h.classList.remove('holding');const f=act[h.dataset.hold];if(f)f(h.dataset,h)},1000);
});
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>{
  if(!holdT)return;clearTimeout(holdT);holdT=null;
  const h=document.querySelector('.holding');
  if(h){h.classList.remove('holding');h.classList.add('nudge');setTimeout(()=>h.classList.remove('nudge'),450)}
}));

});
